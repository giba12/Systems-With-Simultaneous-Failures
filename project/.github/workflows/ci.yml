# PSEUDO-CODE
#   on every push and pull request:
#     check out the code
#     configure with CMake (Release)
#     build the library, the CLI and the tests
#     run all tests with CTest and print failures
#   (Requirement NFR-007. Record compiler version in the log for the verification report.)
name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler
        run: g++ --version && cmake --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
